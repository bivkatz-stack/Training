<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <meta name="description" content="Dein persönlicher Trainings-Tracker – privat und offline.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <title>Mein Training</title>
</head>
<body>
  <header class="topbar">
    <div><p class="eyebrow">PERSÖNLICH · OFFLINE</p><h1>Mein Training</h1></div>
    <span class="status-dot" aria-label="Lokal gespeichert"></span>
  </header>
  <main id="app" class="content" aria-live="polite"></main>
  <nav class="tabs" aria-label="Hauptnavigation">
    <button type="button" data-tab="training" aria-current="page"><span>＋</span>Training</button>
    <button type="button" data-tab="plans"><span>▤</span>Pläne</button>
    <button type="button" data-tab="history"><span>↗</span>Verlauf</button>
    <button type="button" data-tab="settings"><span>⚙</span>Einstellungen</button>
  </nav>
  <dialog id="editor" aria-labelledby="dialog-title">
    <form id="editor-form" method="dialog">
      <div class="dialog-heading"><h2 id="dialog-title">Bearbeiten</h2><button class="icon-button" value="cancel" aria-label="Schließen">×</button></div>
      <div id="editor-fields"></div>
      <div class="dialog-actions"><button class="button secondary" value="cancel">Abbrechen</button><button class="button primary" id="editor-save" value="save">Speichern</button></div>
    </form>
  </dialog>
  <div id="toast" role="status" class="toast"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
